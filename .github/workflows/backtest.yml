name: Frozen v0.4 out-of-sample backtest

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Historical year to test"
        required: true
        default: "2022"
        type: choice
        options:
          - "2021"
          - "2022"
          - "2023"
          - "2024"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/backtest.yml"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate frozen rules
        run: python -m pytest -q
      - name: Run frozen v0.4
        run: python src/run_out_of_sample.py --year "${{ inputs.year || '2022' }}"
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: market-signal-lab-${{ inputs.year || '2022' }}
          path: results/
          if-no-files-found: error
