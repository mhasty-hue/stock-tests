name: Catalyst Ignition v0.3 two-stage scan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/catalyst_ignition_v03.py"
      - ".github/workflows/ignition_v03.yml"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run Catalyst Ignition v0.3
        env:
          IGNITION_MIN_PRICE: "2"
          IGNITION_MAX_PRICE: "100"
          IGNITION_MIN_DOLLAR_VOL: "1000000"
          IGNITION_MAX_SYMBOLS: "5000"
          IGNITION_TOP_DEEP: "120"
          IGNITION_BATCH_SIZE: "50"
        run: python src/catalyst_ignition_v03.py
      - name: Upload v0.3 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalyst-ignition-v03
          path: results_v03/
          if-no-files-found: warn
