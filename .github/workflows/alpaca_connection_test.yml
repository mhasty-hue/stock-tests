name: Alpaca paper data connection test

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/alpaca_connection_test.py'
      - '.github/workflows/alpaca_connection_test.yml'

jobs:
  test-alpaca-data:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test Alpaca paper market data
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python src/alpaca_connection_test.py

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpaca-connection-test
          path: results_alpaca_test/
          if-no-files-found: warn
